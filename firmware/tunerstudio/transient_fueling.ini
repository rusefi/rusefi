; Visual organization only. No new ECU fields, tables or output channels.
; Define every child dialog before its parent (IniReferenceValidator).
; [tag:transient_compact_layout] Keep controls/readouts in North wrappers.
; East/West columns of circular gauges stretch every row in adjacent controls.
; Only editors and graphs should consume additional window height.

dialog = aeGeneralControls, "Strategy and integration"
    field = "Accel Enrichment Mode", accelEnrichmentMode
    field = "Suspend corrections after VE edits", isTuningDetectorEnabled
    field = "Pause STFT learning after acceleration", noFuelTrimAfterAccelTime
    field = "Changing MS/Percent Adder reinterprets table values without conversion."

dialog = aeTpsDetectionControls, "TPS event detection"
    field = "TPS opening threshold", tpsAccelEnrichmentThreshold
    field = "TPS history window", tpsAccelLookback, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}
    field = "TPS closing threshold", tpsDecelEnleanmentThreshold, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}
    field = "Deceleration coefficient", tpsDecelEnleanmentMultiplier, {1}, {(accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@) && (uiMode == @@UiMode_FULL@@ || uiMode == @@UiMode_INSTALLATION@@)}

dialog = aeLuaDetectionInfo, "Lua event detection"
    field = "The script controls event detection, magnitude and decay."
    field = "Native TPS detection and pump settings do not shape Lua AE."

dialog = aePumpControls, "Accelerator pump"
    field = "Cycles per fuel portion", tpsAccelFractionPeriod
    field = "Fuel portion divisor", tpsAccelFractionDivisor@@if_ts_show_FractionDivisor
    field = "Period 3 / divisor 1 spreads a portion across three cycles."
    field = "Period 1 / divisor 2 delivers diminishing portions: 1/2, 1/4, 1/8..."

indicatorPanel = aeOpeningIndicator
    indicator = {isAboveAccelThreshold}, "TPS opening below threshold", "TPS opening detected", white, black, green, black

indicatorPanel = aeClosingIndicator
    indicator = {isBelowDecelThreshold}, "TPS closing below threshold", "TPS closing detected", white, black, green, black

indicatorPanel = aeTuningIndicator
    indicator = {isTuningNow}, "No VE edit detected", "VE tuning detected", white, black, yellow, black

readoutPanel = aeInputReadouts, 3
    readout = transientRpmGauge
    readout = transientTpsGauge
    readout = transientRpmAccelerationGauge

readoutPanel = aeTpsEventReadouts, 3
    readout = transientTpsFromGauge
    readout = transientTpsToGauge
    readout = transientDeltaTpsGauge

dialog = aeTpsEventIndicators, "", xAxis
    panel = aeOpeningIndicator
    panel = aeClosingIndicator, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}

dialog = aeTpsDetectionMonitor, "Selected TPS event"
    panel = aeTpsEventReadouts
    panel = aeTpsEventIndicators

dialog = aeSettingsMonitor, "Live inputs"
    panel = aeInputReadouts
    panel = aeTpsDetectionMonitor, Center, {1}, {accelEnrichmentMode != @@accel_enrichment_mode_e_AE_MODE_LUA@@}
    panel = aeTuningIndicator

dialog = TpsAccelPanel, ""
    panel = aeGeneralControls
    panel = aeTpsDetectionControls, Center, {1}, {accelEnrichmentMode != @@accel_enrichment_mode_e_AE_MODE_LUA@@}
    panel = aePumpControls, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}
    panel = aeLuaDetectionInfo, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_LUA@@}

dialog = aeSettingsContent, ""
    panel = TpsAccelPanel
    panel = aeSettingsMonitor

dialog = AccelEnrich, "Acceleration enrichment settings", border
    topicHelp = "AccelEnrichHelp"
    panel = aeSettingsContent, North

readoutPanel = aeMsCalibrationReadouts, 3
    readout = transientRpmGauge
    readout = transientTpsGauge
    readout = transientRpmAccelerationGauge
    readout = transientPulseGauge
    readout = transientTableMsGauge
    readout = transientAeMsGauge

readoutPanel = aeFractionCalibrationReadouts, 3
    readout = transientRpmGauge
    readout = transientTpsGauge
    readout = transientRpmAccelerationGauge
    readout = transientPulseGauge
    readout = transientTableFractionGauge
    readout = transientAeFractionGauge

indicatorPanel = aeFractionalIndicator
    indicator = {isFractionalEnrichment}, "Last calculation: no fractional spreading", "Last calculation: fractional spreading", white, black, green, black

dialog = aePumpMonitor, "Fractional pump - last calculated values"
    runtimeValue = "Accumulated enrichment (ms/fraction)", accumulatedValue
    runtimeValue = "Fractional portion (ms/fraction)", fractionalInjFuel
    runtimeValue = "Cycle counter", cycleCnt
    panel = aeFractionalIndicator
    field = "Intermediate values can retain their last calculation when AE is suspended."

dialog = aeAdderMonitor, "Calculated enrichment"
    panel = aeMsCalibrationReadouts, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@}
    panel = aeFractionCalibrationReadouts, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}
    panel = aePumpMonitor, Center, {1}, {(uiMode == @@UiMode_FULL@@ || uiMode == @@UiMode_INSTALLATION@@) && (tpsAccelFractionPeriod > 1 || tpsAccelFractionDivisor > 1)}

dialog = aeAdderHeader, ""
    field = "MS Adder: milliseconds. Percent Adder: fraction (0.20 = +20% in sequential)."
    field = "Table -> fractional pump -> RPM -> flex -> injection-mode scaling."
    panel = aeAdderMonitor

dialog = aeAdderEditors, "", border
    panel = tpsTpsAccelTbl, Center
    panel = tpsTspRpmCorrection, South

dialog = aeAdderCalibration, "", border
    panel = aeAdderHeader, North
    panel = aeAdderEditors, Center
    liveGraph = aeAdderHistory, "TPS, RPM response and injection fueling", South
        graphLine = TPSValue
        graphLine = rpmAcceleration, "RPM/s", -5000, 5000, auto, auto
        graphLine = tpsAccelFuel
        graphLine = actualLastInjection

indicatorPanel = aePredictionIndicator
    indicator = {isMapPredictionActive}, "Using measured MAP", "MAP prediction active", white, black, green, black

indicatorPanel = aeMapSensorIndicator
    indicator = {isMapError}, "MAP sensor OK", "MAP sensor error", white, black, red, black

readoutPanel = aeEffectiveMapReadout, 1
    readout = transientEffectiveMapGauge

dialog = aeEffectiveMapMonitor, "MAP used by prediction"
    panel = aeEffectiveMapReadout
    panel = aePredictionIndicator

readoutPanel = aeMapReadouts, 2
    readout = transientMeasuredMapGauge
    readout = transientEstimatedMapGauge

dialog = aeMapMonitor, "Manifold pressure"
    panel = aeInputReadouts
    panel = aeMapReadouts
    panel = aeEffectiveMapMonitor, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PREDICTIVE_MAP@@}
    panel = aeMapSensorIndicator

dialog = aeMapPredictionHeader, ""
    field = "Estimated MAP is pressure in kPa, not an extra-fuel amount."
    field = "Measured MAP catching up or throttle closing can end prediction early."
    field = "A higher estimate can restart the transition."
    panel = aeMapMonitor

dialog = aePredictiveHistoryInfo, "Automatic TPS history"
    field = "The highest duration in this curve automatically sizes TPS history."
    field = "At the current RPM, the interpolated value sets the MAP transition duration."

dialog = aeMapDurationSection, "", border
    panel = aePredictiveHistoryInfo, North
    panel = predictiveMapBlendDuration, Center

dialog = aeMapPredictionEditors, "", border
    panel = mapEstimateTableTbl, Center
    panel = aeMapDurationSection, South

dialog = aeMapPredictionCalibration, "", border
    panel = aeMapPredictionHeader, North
    panel = aeMapPredictionEditors, Center
    liveGraph = aeMapHistory, "Measured, estimated and effective MAP / RPM response", South
        graphLine = TPSValue
        graphLine = rpmAcceleration, "RPM/s", -5000, 5000, auto, auto
        graphLine = MAPValue
        graphLine = fallbackMap
        graphLine = effectiveMap

dialog = aeMapFallbackHeader, ""
    field = "Speed Density uses this table when the MAP sensor reading is invalid."
    field = "The predictive blend-duration curve does not apply to this fallback."
    panel = aeMapMonitor

dialog = aeMapFallbackCalibration, "", border
    panel = aeMapFallbackHeader, North
    panel = mapEstimateTableTbl, Center

dialog = aeMapIncompatibleInfo, "MAP prediction requirements"
    field = "MAP Prediction requires Speed Density and valid measured MAP."
    field = "The selected fuel algorithm does not apply predictive MAP correction."
    field = "Native MS/Percent adders are also disabled while MAP Prediction is selected."

dialog = aeLuaContent, "Lua AE instructions"
    field = "Use setAccelEnrichment(grams): extra fuel per cylinder per engine cycle."
    field = "Refresh before 200 ms, normally every onTick. Zero disables the correction."
    field = "An expired request contributes zero, with no native-AE fallback."
    field = "Stopped/cranking operation, DFCO and VE-tuning detection suppress application."
    field = "The script controls TPS detection, RPM and flex compensation."

readoutPanel = aeLuaReadouts, 3
    readout = transientRpmGauge
    readout = transientTpsGauge
    readout = transientRpmAccelerationGauge
    readout = transientPulseGauge
    readout = transientLuaMassGauge
    readout = transientCltGauge

dialog = aeLuaHeader, ""
    panel = aeLuaContent
    panel = aeLuaReadouts
    field = "Zero alone does not distinguish a zero, expired or suppressed request."

dialog = aeLuaCalibration, "", border
