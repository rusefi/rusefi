    panel = wwBetaCltCurve, Center
    panel = wwBetaMapCurve, South

dialog = aeWallCurves, "", xAxis
    panel = wwTauCurves, Center, {1}, {complexWallModel != 0}@@if_ts_show_adv_wall_wetting
    panel = wwBetaCurves, Center, {1}, {complexWallModel != 0}@@if_ts_show_adv_wall_wetting

