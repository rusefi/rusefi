    readout = transientMeasuredMapGauge
    readout = transientMeasuredMixtureGauge

readoutPanel = aeWallInputReadouts, 3
    readout = transientRpmGauge
    readout = transientCltGauge
    readout = transientRpmAccelerationGauge

readoutPanel = aeWallResultReadouts, 2
    readout = transientWallAmountGauge
    readout = transientWallCorrectionGauge

