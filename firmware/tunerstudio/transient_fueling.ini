    panel = aeFlexInputReadouts
    panel = aeFlexAeMonitor, Center, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@ && flexFuelTransientComp && (accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@)}
    panel = aeFlexFilmMonitor, Center, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@ && flexFuelTransientComp}
    panel = aeFlexSensorIndicator
    field = "Bypassed paths may retain their last evaluated multipliers."
    field = "E0 and sensor errors do not hide this screen."

dialog = aeFlexContent, ""
    panel = aeFlexControls
    panel = aeFlexMonitor
    panel = aeFlexTables

dialog = flexTransientDialog, "Flex fuel transient compensation", border
    topicHelp = "flexTransientHelp"
    panel = aeFlexContent, North, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@}

help = mapPredictionHelp, "MAP prediction and sensor fallback"
    text = "The estimated-MAP table contains pressure in kPa versus TPS and RPM. With MAP Prediction and Speed Density selected, the duration curve controls the transition from estimated pressure toward measured MAP.<br>"
    text = "The highest duration in that curve sizes TPS history automatically. The interpolated value at the current RPM sets the transition duration. Measured MAP catching up or throttle closing can end it early.<br>"
    text = "In other AE modes with Speed Density, the same table provides an advanced fallback for an invalid MAP reading. The blend-duration curve is not used for sensor fallback. This shared table is edited only on this screen.<br>"
    text = "ECU RPM acceleration is the existing rpmAcceleration telemetry: positive means rising engine speed and negative means falling speed. It refreshes on the cycle-based RPM path and may retain its last value with forced instant RPM. It is an ECU diagnostic estimate, not a separately computed derivative in this screen.<br>"

help = wallWettingTransientHelp, "Wall wetting compensation"
    text = "The fuel-film model operates independently of the selected AE strategy. Basic uses two constants. Advanced exposes four curves: tau versus CLT, tau versus MAP, beta versus CLT, and beta versus MAP.<br>"
    text = "The ECU applies MAP multipliers when a MAP sensor is registered, regardless of its input source. A missing analog MAP pin does not hide the curves. Without a registered MAP sensor these multipliers are skipped. An invalid registered MAP reading uses 60 kPa.<br>"
    text = "Tau is an exponential evaporation time constant, not the time for all wall fuel to disappear. Beta is a deposition fraction: 0.20 represents 20%. Flex transient multipliers apply to both models.<br>"
    text = "The controller bypasses compensation during cranking, below 100 RPM or when effective tau/beta is below 0.01. Film/correction telemetry describes the first injection event; the correction can retain its last calculated value during bypass.<br>"
    text = "ECU RPM acceleration shows the existing cycle-based rpmAcceleration signal. Positive means rising RPM, negative means falling RPM. Forced instant RPM can leave it unchanged. See Acceleration enrichment settings help for its calculation limits.<br>"
    text = "Measured mixture 1 uses the existing wideband-1 reading and follows the project's Lambda/AFR display preference. It requires a configured, working wideband input; it is the exhaust reading, which includes sensor and exhaust transport delay.<br>"

help = flexTransientHelp, "Flex fuel transient compensation"
    text = "A configured flex input makes this screen available even at E0 or with an invalid reading. The switch controls all three CLT/ethanol multiplier tables. The additive AE table applies only to MS/Percent Adder; tau/beta apply in every AE strategy and in Basic/Advanced.<br>"
    text = "The tables share their CLT and ethanol axes. Multiplier 1.00 is neutral; interpolated values at or below 0.01 are also treated as neutral. Without a registered ethanol sensor the firmware uses neutral multipliers. Invalid registered readings use 50% ethanol or 90 C for invalid coolant.<br>"
    text = "This setting does not enable base stoichiometric blending or flex cranking/priming. The gauges show last evaluated multipliers and need not refresh on bypassed paths.<br>"
    text = "In MS/Percent Adder, the AE flex multiplier is applied independently of wall wetting. Disabling wall compensation does not disable this additive AE correction. MAP Prediction and Lua do not use the additive AE flex table.<br>"
