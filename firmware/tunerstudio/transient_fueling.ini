dialog = aeFlexTauCalibration, "Fuel-film evaporation flex multiplier"
    panel = flexWwTauMultTbl
    field = "Applies in both wall models and all AE modes. Above 1 slows evaporation."

dialog = aeFlexBetaCalibration, "Fuel-film deposition flex multiplier"
    panel = flexWwBetaMultTbl
    field = "Applies in both wall models and all AE modes. Above 1 increases deposition."

dialog = aeFlexTables, ""
    panel = aeFlexAeCalibration, Center, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@ && flexFuelTransientComp && (accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@)}
    panel = aeFlexTauCalibration, Center, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@ && flexFuelTransientComp}
    panel = aeFlexBetaCalibration, Center, {1}, {flexSensorPin > @@TRANSIENT_INPUT_INVALID@@ && flexFuelTransientComp}

readoutPanel = aeFlexAeMonitor, 1
