        graphLine = actualLastInjection

dialog = aeTpsCalibrationContent, ""
    panel = aeAdderCalibration, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_MS_ADDER@@ || accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PERCENT_ADDER@@}
