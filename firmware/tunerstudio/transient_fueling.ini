    panel = aeMapPredictionCalibration, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PREDICTIVE_MAP@@ && fuelAlgorithm == @@engine_load_mode_e_LM_SPEED_DENSITY@@}@@if_ts_show_map_estimate
    panel = aeMapIncompatibleInfo, Center, {1}, {accelEnrichmentMode == @@accel_enrichment_mode_e_AE_MODE_PREDICTIVE_MAP@@ && fuelAlgorithm != @@engine_load_mode_e_LM_SPEED_DENSITY@@}
    panel = aeMapFallbackCalibration, Center, {1}, {accelEnrichmentMode != @@accel_enrichment_mode_e_AE_MODE_PREDICTIVE_MAP@@ && fuelAlgorithm == @@engine_load_mode_e_LM_SPEED_DENSITY@@ && (uiMode == @@UiMode_FULL@@ || uiMode == @@UiMode_INSTALLATION@@)}@@if_ts_show_map_estimate

dialog = mapPredictionDialog, "MAP prediction and sensor fallback", border
    topicHelp = "mapPredictionHelp"
    panel = aeMapCalibrationContent, North

dialog = WallWettingAccelPanel, "Fuel-film model"
    field = "Wall fueling model type", complexWallModel@@if_ts_show_complexWallModel
    field = "Evaporation time constant - tau", wwaeTau, {1}, {complexWallModel == 0}
    field = "Fuel deposition fraction - beta", wwaeBeta, {1}, {complexWallModel == 0}
    field = "Wall wetting is independent of the AE strategy."
    field = "Flex multipliers: see Flex fuel transient compensation."

dialog = wwTauHelp, ""
