    field = "Base stoichiometry, cranking and priming are configured separately."
    field = "All three tables share their coolant and ethanol bins."
    field = "Multiplier 1.00 is neutral. Invalid readings use 50% ethanol / 90 C."

dialog = aeFlexAeCalibration, "Additive TPS AE flex multiplier"
    panel = flexAeMultTbl
