# see https://www.msextra.com/doc/pdf/Microsquirt-IObox-1.pdf

pins:
  - pin: canbus-1
    id: EXTIOCHIP_0_IO_1
    class: outputs
    function: low side, high current
    ts_name: MS IO-Box 0 OUT 1

  - pin: canbus-2
    id: EXTIOCHIP_0_IO_2
    class: outputs
    function: low side, high current
    ts_name: MS IO-Box 0 OUT 2

  - pin: canbus-3
    id: EXTIOCHIP_0_IO_3
    class: outputs
    function: low side, mid current
    ts_name: MS IO-Box 0 OUT 3

  - pin: canbus-4
    id: EXTIOCHIP_0_IO_4
    class: outputs
    function: low side, mid current
    ts_name: MS IO-Box 0 OUT 4

  - pin: 16
    id: EXTIOCHIP_0_IO_5
    class: outputs
    function: low side, mid current
    ts_name: MS IO-Box 0 OUT 5

  - pin: 17
    id: EXTIOCHIP_0_IO_6
    class: outputs
    function: low side, mid current
    ts_name: MS IO-Box 0 OUT 6

  - pin: 35
    id: EXTIOCHIP_0_IO_7
    class: outputs
    function: low side, mid current
    ts_name: MS IO-Box 0 OUT 7

# EXTIOCHIP_0_IO_8 does not exist

  - pin: 32
    id: [EXTIOCHIP_0_IO_9, EXTIOCHIP_0_IO_9]
    class: [event_inputs, switch_inputs]
    function: VR+
    ts_name: MS IO-Box 0 VSS1 (VR)

  - pin: 4
    id: [EXTIOCHIP_0_IO_10, EXTIOCHIP_0_IO_10]
    class: [event_inputs, switch_inputs]
    function: VR+
    ts_name: MS IO-Box 0 VSS2 (VR)

  - pin: 11
    id: [EXTIOCHIP_0_IO_11, EXTIOCHIP_0_IO_11]
    class: [event_inputs, switch_inputs]
    function: VR+
    ts_name: MS IO-Box 0 VSS2 (Hall)

  - pin: 12
    id: [EXTIOCHIP_0_IO_12, EXTIOCHIP_0_IO_12]
    class: [event_inputs, switch_inputs]
    function: VR+
    ts_name: MS IO-Box 0 VSS3 (Hall)

  - pin: 6
    id: EXTIOCHIP_0_IO_13
    class: switch_inputs
    function: VR+
    ts_name: MS IO-Box 0 SW1

# EXTIOCHIP_0_IO_14 and EXTIOCHIP_0_IO_15 are multiplexed with VSS2, VSS3
# EXTIOCHIP_0_IO_16 is not exist

# TODO: add ADC inputs

info:
  cid: iobox
