meta: config/boards/hellen_mm100_meta.h

pins:
  - pin: On-board MAP
    meta: MM100_IN_MAP2_ANALOG
    class: analog_inputs
    type: av
    function: MAP Sensor Input
    ts_name: On-board MAP
    color: orange

  - pin: A1
    function: DC1- (ETB/stepper; disconnect when A5 is used as an GPIO output)
    type: etb
    color: white

  - pin: A2
    function: DC2- (ETB/stepper; disconnect when A6 is used as an GPIO output)
    type: etb
    color: white

  - pin: A3
    function: Power/Chassis GND ground
    color: black
    type: gnd

  - pin: A4
    function: Power/Chassis GND ground
    color: black
    type: gnd

  - pin: A5
    id: HBRIDGE_1_OUT
    class: outputs
    function: DC1+ / H-Bridge 1 on-off output
    type: etb
    color: blue
    ts_name: A5 - DC1+ H-Bridge Output

  - pin: A6
    id: HBRIDGE_2_OUT
    class: outputs
    function: DC2+ / H-Bridge 2 on-off output
    type: etb
    color: blue
    ts_name: A6 - DC2+ H-Bridge Output

  - pin: A7
    meta: MM100_IN_VBATT
    class: analog_inputs
    color: red
    function: Ignition Switch / Battery Voltage Analog Input
    ts_name: ___ Voltage From Key

  - pin: A8
    color: red
    function: +12V From Main Relay

info:
  cid: a
  title: uaefi
  name: connector A
  directory: hellen/uaefi
  board_url: https://wiki.rusefi.com/uaefi
  image:
    file: uaefi-A-front.png
  # Mating face, latch up. Coordinates are pixels in the 1536x1024 image.
  # Shared row centers: top y=389, bottom y=660; see docs/imagegen.md.
  pins:
    - pin: A1
      x: 1222
      y: 660
    - pin: A2
      x: 916
      y: 660
    - pin: A3
      x: 620
      y: 660
    - pin: A4
      x: 313
      y: 660
    - pin: A5
      x: 1222
      y: 389
    - pin: A6
      x: 916
      y: 389
    - pin: A7
      x: 620
      y: 389
    - pin: A8
      x: 313
      y: 389
