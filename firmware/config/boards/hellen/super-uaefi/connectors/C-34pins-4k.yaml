meta: config/boards/hellen_mm100_meta.h

pins:
  - pin: 1C
    meta: MM100_IN_VBATT
    class: analog_inputs
    color: red
    type: 12v
    function: Ignition Switch / Battery Voltage Analog Input
    ts_name: ___ Voltage From Key

  - pin: 2C
    function: +12v from main relay OUTPUT
    type: 12V
#    ??????????????????????
#    function: WBO2 Heater Positive (pin 4)
#    type: wbo
#    color: grey

  - pin: 3C
    function: WBO2 SWD (low-level controller programming access)

  - pin: 4C
    function: WBO2 SWC (low-level controller programming access)

  - pin: 5C
    function: WBO2 Vs (Un) (pin 6)
    type: wbo
    color: black

  - pin: 6C
    function: WBO2 CalR (pin 5)
    type: wbo
    color: green

  - pin: 7C
    function: WBO2 Ip (pin 1)
    type: wbo
    color: red

  - pin: 8C
    function: WBO2 Vs/Ip (Vm) (pin 2)
    type: wbo
    color: yellow

  - pin: 9C
    function: WBO2 Heater Negative (pin 3) (and heater +12 could use 11C)
    color: white
    type: wbo

  - pin: 10C
    function: +12v from main relay (ecu input to feed h-bridges)
    type: 12V
    color: red

  - pin: 11C
    function: +12v from main relay OUTPUT (most users would NOT use this. hard-wired via fuse for auxiliary pin to daisy chain switched power to consumers like WBO heater)
    type: 12V

  - pin: 12C
    function: USB VBUS

  - pin: 13C
    function: USB D-

  - pin: 14C
    function: USB D+

  - pin: 15C
    function: PROG BUTTON
    color: white

#  - pin: 16C
#    function:

#  - pin: 17C
#    function:

  - pin: 18C
    function: +12v from main relay OUTPUT (most users would NOT use this. hard-wired via fuse for auxiliary pin to daisy chain switched power to consumers like WBO heater)
    type: 12V

#  - pin: 19C
#    function:

#  - pin: 20C
#    function:

  - pin: 21C
    function: Power/Chassis GND ground
    type: gnd
#   color: red / black

  - pin: 22C
    function: Power/Chassis GND ground
    type: gnd
#   color: red / black

#  - pin: 23C
#    function:

#  - pin: 24C
#   function:

#  - pin: 25C
#    function:

  - pin: 26C
    function: +12v Bat+ (Hot all times)
    type: 12V

  - pin: 27C
    ts_name: EGT+
    function: EGT positive input

  - pin: 28C
    ts_name: EGT-
    function: EGT negative input

  - pin: 29C
    ts_name: ___ LS6_HOT
    meta: MM100_IGN8
    class: outputs
    function: Low-Side 6 fuel relay (always hot capable / relay capable output)
    type: ls

  - pin: 30C
    ts_name: ___ LS5_HOT
    meta: MM100_IGN7
    class: outputs
    function: Low-Side 5 main relay Control Output (always hot capable / relay capable output)
    type: ls

  - pin: 31C
    ts_name: ___ LS4
    meta: MM100_OUT_PWM2
    class: outputs
    function: Low-Side 4 output
    type: ls


