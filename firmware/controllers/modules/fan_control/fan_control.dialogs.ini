;			Engine->Cooling Fans

	dialog = fan1PwmGauges, "Fan 1 PWM status", xAxis
		gauge = fan1SpeedTargetGauge@@if_ts_show_fan_settings
		gauge = fan1SpeedAppliedGauge@@if_ts_show_fan_settings
		gauge = fan1PwmAppliedGauge@@if_ts_show_fan_settings

	dialog = fan2PwmGauges, "Fan 2 PWM status", xAxis
		gauge = fan2SpeedTargetGauge@@if_ts_show_fan2_settings
		gauge = fan2SpeedAppliedGauge@@if_ts_show_fan2_settings
		gauge = fan2PwmAppliedGauge@@if_ts_show_fan2_settings


	; Only used by the on/off relay path - PWM mode uses the PWM curve itself as the source of
	; truth for speed vs temperature (its lowest/highest bins double as "off"/"full speed").
	dialog = fan1RelaySettings, "Fan 1 On/Off"
		field = "On temperature",					fanOnTemperature, { !fan1PwmEnabled }
		field = "Off temperature",					fanOffTemperature, { !fan1PwmEnabled }

	dialog = fan1PwmSettings, "Fan 1 PWM"
		field = "Enable PWM mode",					fan1PwmEnabled
		field = "PWM frequency",					fan1PwmFrequency, { fan1PwmEnabled }
		field = "PWM duty for fan OFF",			fan1MinPwm, { fan1PwmEnabled }
		field = "PWM duty for fan FULL speed",		fan1MaxPwm, { fan1PwmEnabled }
		field = "Soft-start time",					fan1SoftStartSec, { fan1PwmEnabled }

	dialog = fan1PwmCurveDialog, "Fan 1 Speed Demand Curve"
		panel = fan1PwmCurve
		panel = fan1PwmGauges

	dialog = fan1Config, "Fan 1"
		field = "Output",							fanPin, 1, { uiMode == @@UiMode_FULL@@ || uiMode == @@UiMode_INSTALLATION@@ }
		field = "Output mode",						fanPinMode, { uiMode == @@UiMode_FULL@@ || uiMode == @@UiMode_INSTALLATION@@ }
		field = "A/C control mode", fan1AcMode
		field = "A/C pressure on / full speed", fan1AcPressureOn, { fan1AcMode == 2 }
		field = "A/C pressure off", fan1AcPressureOff, { fan1AcMode == 2 }
		field = "Disable when engine stopped",		disableFan1WhenStopped
		field = "Disable above vehicle speed",		disableFan1AtSpeed
		field = "Disable speed hysteresis",		disableFan1AtSpeedHysteresis, { disableFan1AtSpeed > 0 }
		field = "Idle adder",						fan1ExtraIdle
		panel = fan1RelaySettings
		panel = fan1PwmSettings

	; Only used by the on/off relay path - see fan1RelaySettings above.
	dialog = fan2RelaySettings, "Fan 2 On/Off"
		field = "On temperature",					fan2OnTemperature, { !fan2PwmEnabled }
		field = "Off temperature",					fan2OffTemperature, { !fan2PwmEnabled }

	dialog = fan2PwmSettings, "Fan 2 PWM"
		field = "Enable PWM mode",					fan2PwmEnabled
		field = "PWM frequency",					fan2PwmFrequency, { fan2PwmEnabled }
		field = "PWM duty for fan OFF",			fan2MinPwm, { fan2PwmEnabled }
		field = "PWM duty for fan FULL speed",		fan2MaxPwm, { fan2PwmEnabled }
		field = "Soft-start time",					fan2SoftStartSec, { fan2PwmEnabled }

	dialog = fan2PwmCurveDialog, "Fan 2 Speed Demand Curve"
		panel = fan2PwmCurve
		panel = fan2PwmGauges

	dialog = fan2Config, "Fan 2"
		field = "Output",							fan2Pin
		field = "Output mode",						fan2PinMode
		field = "A/C control mode", fan2AcMode
		field = "A/C pressure on / full speed", fan2AcPressureOn, { fan2AcMode == 2 }
		field = "A/C pressure off", fan2AcPressureOff, { fan2AcMode == 2 }
		field = "Disable when engine stopped",		disableFan2WhenStopped
		field = "Disable above vehicle speed",		disableFan2AtSpeed
		field = "Disable speed hysteresis",		disableFan2AtSpeedHysteresis, { disableFan2AtSpeed > 0 }
		field = "Idle adder",						fan2ExtraIdle
		panel = fan2RelaySettings
		panel = fan2PwmSettings

	; Both auto-generated indicator panels stacked in the centre column
	dialog = fanIndicatorsCenter, "Status"
		panel = fan_control0IndicatorPanel
		panel = fan_control1IndicatorPanel@@if_ts_show_fan2_settings

	; Simple on/off state + test buttons along the bottom
	indicatorPanel = fanOnOffIndicators, 2
		indicator = { fan1m_state }, "Fan 1 Off", "Fan 1 On", white, black, green, black
		indicator = { fan2m_state }, "Fan 2 Off", "Fan 2 On", white, black, green, black

	dialog = fanBottom, "", xAxis
		panel = fanOnOffIndicators
		commandButton = "Test Fan 1", cmd_test_fan_1
		commandButton = "Test Fan 2", cmd_test_fan_2

	; Fan 1 | Status indicators | Fan 2
	dialog = fanSettings, "Cooling Fans", border
		panel = fan1Config, West
		panel = fanIndicatorsCenter, Center
		panel = fan2Config, East@@if_ts_show_fan2_settings
		panel = fanBottom, South

