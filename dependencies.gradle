ext {
  global_libs = [
          junit4         : "junit:junit:4.13.2",
          junit5         : "org.junit.jupiter:junit-jupiter-api:$junit5Version",
          junit5engine   : "org.junit.jupiter:junit-jupiter-engine:$junit5Version",
          // Gradle 9 does not provide the JUnit Platform launcher implicitly anymore
          junit5launcher : "org.junit.platform:junit-platform-launcher:$junit5Version",
          junit5api   : "org.junit.jupiter:junit-jupiter-api:$junit5Version",
          annotations    : "org.jetbrains:annotations:26.1.0",
          jsr305         : "com.google.code.findbugs:jsr305:3.0.2",
          antlr          : "org.antlr:antlr4:4.13.2",
          json           : "com.googlecode.json-simple:json-simple:1.1.1",
          mockito        : "org.mockito:mockito-core:5.23.0",
          javaxJson      : "javax.json:javax.json-api:1.1.4",
          snakeyaml      : "org.yaml:snakeyaml:2.6",
          commons_logging: "commons-logging:commons-logging:1.4.0",
          jcip           : 'net.jcip:jcip-annotations:1.0',
    // jakarta 4 (the project bytecode is Java 25 now; jakarta 3 was kept for the TS plugin's java 8 runtime)
          jaxb           : 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5',
          jaxb_runtime   : 'org.glassfish.jaxb:jaxb-runtime:4.0.9',
  ]

  ts_plugin_libs = [
          httpclient  : "org.apache.httpcomponents.client5:httpclient5:5.6.4",
          httpcore    : "org.apache.httpcomponents.core5:httpcore5:5.4.3",
          launcher_api: fileTree( dir: "lib", include: "TunerStudioPluginAPI.jar" )
  ]
}
