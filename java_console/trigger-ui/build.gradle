

apply from: dependenciesPath

dependencies {
    api project(':core_ui')
    api project(':shared_ui')
    api project(':models')
    api project(':trigger-image')
    api project(':autoupdate') // a mess of UI code reuse
}

// The only file under src/test is a manual sandbox (TriggerImageOnlyWheelSandbox),
// not a JUnit test class - Gradle 9 fails the task when nothing is discovered.
test {
    failOnNoDiscoveredTests = false
}

shadowJar {
  manifest {
    attributes(
      'Main-Class': 'com.rusefi.trigger.TriggerImage'
    )
  }
}
