# rusEFI console theme: dark colours. [tag:console_theme] [tag:console_dark_mode]
# Same palette variables and keys as FlatLightLaf.properties, with dark values;
# ThemeParityTest keeps the two key sets equal and checks contrast. Keys that only
# one theme can share (accent shades, solid chips, pin type colours) have their own
# value here. Until the dark theme is finished it is only used with -Dconsole.theme=dark.

#---- palette ----

@background = #16191f
@foreground = #e6e9ef
@menuBackground = #1d2129
@accentBaseColor = #3474e0

@rusefiSeparator = #2e343e
@rusefiMutedForeground = #9aa4b2
@rusefiAccentForeground = #8ab4ff
@rusefiChipBackground = #272c35
# cards, popups and the selected segment of a switch
@rusefiSurface = #1f232b
# tinted block inside a card
@rusefiSectionBackground = #252a33
# track and border of segmented switches
@rusefiControlTrack = #2a3039
@rusefiControlBorder = #3a414c

# states: text, dot or solid mark, soft background
@rusefiGood = #4ade80
@rusefiGoodDot = #22c55e
@rusefiGoodBackground = #12301e
@rusefiWarn = #fbbf24
@rusefiWarnDot = #f59e0b
@rusefiWarnBackground = #36280f
@rusefiBad = #f87171
@rusefiBadDot = #ef4444
@rusefiBadBackground = #3a1717
@rusefiInfoBackground = #172540

#---- window frame and menu bar ----

TitlePane.borderColor = @rusefiSeparator
MenuBar.borderColor = @rusefiSeparator
Separator.foreground = @rusefiSeparator

# console title text (TitleBarPanel, KeyBadgeIcon)
Console.TitleBar.mutedForeground = @rusefiMutedForeground
Console.TitleBar.chipBackground = @rusefiChipBackground

#---- frame overlays, banners and links (MainFrame, StartupFrame, URLLabel) ----

# full-window messages: firmware check, connection failure, unsaved tune
Console.Overlay.foreground = @foreground
Console.Overlay.good = @rusefiGood
Console.Overlay.bad = @rusefiBad
# "running from an extracted bundle" strip at the top of the window
Console.InstallerBanner.background = #2f2610
Console.InstallerBanner.borderColor = #5a4718
Console.Link.foreground = @rusefiAccentForeground
# short error lines, e.g. "firmware file not found"
Console.ErrorText.foreground = @rusefiBad
Console.HorizontalLine.foreground = #6b7585
Console.Announcement.borderColor = #6b7585

#---- tabs ----

TabbedPane.foreground = @rusefiMutedForeground
TabbedPane.hoverForeground = @foreground
TabbedPane.selectedForeground = @rusefiAccentForeground
TabbedPane.underlineColor = @accentBaseColor
TabbedPane.contentAreaColor = @rusefiSeparator
# the main tab row (TabbedPanel)
Console.TabArea.background = @menuBackground
# bottom status strip of the Gauges, Messages and Engine Sniffer tabs (WarningPanel)
Console.StatusBar.background = @menuBackground
# Gauges toolbar (RPM, command box, Edit dashboard)
Console.Toolbar.background = @menuBackground

#---- connection badge (ConnectionStatusIcon) ----

Console.Status.connected.dot = @rusefiGoodDot
Console.Status.connected.background = @rusefiGoodBackground
Console.Status.connected.foreground = @rusefiGood
Console.Status.disconnected.dot = @rusefiBadDot
Console.Status.disconnected.background = @rusefiBadBackground
Console.Status.disconnected.foreground = @rusefiBad
Console.Status.pending.dot = @rusefiWarnDot
Console.Status.pending.background = @rusefiWarnBackground
Console.Status.pending.foreground = @rusefiWarn
Console.Status.bootloader.dot = #b45cf0
Console.Status.bootloader.background = #2c1a3d
Console.Status.bootloader.foreground = #d8a6ff

# status chips without a connection state (StatusChip): idle, and what the user inspects
Console.Status.neutral.dot = #6b7585
Console.Status.neutral.background = #272c35
Console.Status.neutral.foreground = #9aa4b2
Console.Status.accent.dot = #5b8def
Console.Status.accent.background = #172540
Console.Status.accent.foreground = #8ab4ff

#---- Gauges toolbar: RPM readout (RpmLabel), Grid/Free switch (SegmentedControl) ----

Console.Readout.background = @rusefiChipBackground
Console.Segmented.background = @rusefiControlTrack
Console.Segmented.selectedBackground = #3a414c
Console.Segmented.selectedBorder = #4a525e
# grid size picker in the Edit dashboard menu (SizeSelectorPanel)
Console.GridPicker.background = @rusefiSurface
Console.GridPicker.selectedBackground = #1e3a66
Console.GridPicker.selectedBorder = @accentBaseColor

#---- startup Connect card (com.rusefi.ui.startup) ----

Console.Card.background = @rusefiSurface
Console.Card.borderColor = @rusefiSeparator
Console.Card.sectionBackground = @rusefiSectionBackground
Console.Illustration.line = #8a94a6
Console.Illustration.fill = #272c35
Console.Banner.info.background = @rusefiInfoBackground
Console.Banner.info.borderColor = #29406b
Console.Banner.info.accent = @rusefiAccentForeground
Console.Banner.warning.background = #2f2610
Console.Banner.warning.borderColor = #5a4718
Console.Banner.warning.accent = #e0a83a
Console.Banner.error.background = @rusefiBadBackground
Console.Banner.error.borderColor = #5c2626
Console.Banner.error.accent = @rusefiBad

#---- setup wizard (com.rusefi.ui.wizard.WizardStyle) ----
# step cards reuse Console.Card.*, the header and footer strips Console.TabArea.background

Console.Wizard.mutedForeground = @rusefiMutedForeground
Console.Wizard.accentForeground = @rusefiAccentForeground
Console.Wizard.success.foreground = @rusefiGood
Console.Wizard.success.background = @rusefiGoodBackground
Console.Wizard.error.foreground = @rusefiBad
Console.Wizard.error.background = @rusefiBadBackground

#---- Tuning tab (com.rusefi.ui.widgets.tune.TuningStyle) ----
# the toolbar, indicator row and live value strip reuse Console.Toolbar.background,
# the dialog card reuses Console.Card.*

Console.Tuning.sidebar.background = @menuBackground
Console.Tuning.mutedForeground = @rusefiMutedForeground
Console.Tuning.dirtyForeground = @rusefiWarn
# live value strip (TextGauge): a mild accent tint sets live data apart from settings
Console.Tuning.liveValue.background = shade(@accentBaseColor,78%)
Console.Tuning.liveValue.borderColor = shade(@accentBaseColor,55%)
Console.Tuning.section.borderColor = @rusefiSeparator
Console.Tuning.section.hoverBorderColor = @accentBaseColor
Console.Tuning.section.title = @foreground
# indicators (INI [FrontPage] and dialog indicators): the INI colour names pick a chip colour.
# Red, yellow and green are solid, bold chips that stand out; the other tones stay soft.
Console.Tuning.indicator.neutral.background = @rusefiChipBackground
Console.Tuning.indicator.neutral.foreground = @rusefiMutedForeground
Console.Tuning.indicator.red.background = #dc2626
Console.Tuning.indicator.red.foreground = #ffffff
Console.Tuning.indicator.yellow.background = #f59e0b
Console.Tuning.indicator.yellow.foreground = #1f1300
Console.Tuning.indicator.green.background = #15803d
Console.Tuning.indicator.green.foreground = #ffffff
Console.Tuning.indicator.blue.background = @rusefiInfoBackground
Console.Tuning.indicator.blue.foreground = @rusefiAccentForeground
Console.Tuning.indicator.dark.background = #3d4a5e
Console.Tuning.indicator.dark.foreground = #ffffff

#---- log viewer window (LogViewerPanel, ChartToolbar, LogStatusBar) ----
# its toolbar and status strip reuse Console.Toolbar.background and Console.StatusBar.background

Console.LogViewer.sidebar.background = @menuBackground
Console.LogViewer.mutedForeground = @rusefiMutedForeground
Console.LogViewer.chipBackground = @rusefiChipBackground
Console.LogViewer.sectionDivider = @rusefiSeparator

#---- log viewer plot area (PlotPalette): light and dark plots exist in every theme ----

Console.LogChart.light.background = #ffffff
Console.LogChart.light.grid = #e3e7ed
Console.LogChart.light.label = #586273
Console.LogChart.light.hint = #6b7485
Console.LogChart.light.cursor = #33415599
Console.LogChart.light.selection = #2563eb26
Console.LogChart.light.accent = #2563eb
Console.LogChart.light.trace1 = #2563eb
Console.LogChart.light.trace2 = #9f3804
Console.LogChart.light.trace3 = #049f9f
Console.LogChart.light.trace4 = #fa428c
Console.LogChart.light.trace5 = #7d9004
Console.LogChart.light.trace6 = #a0224c
Console.LogChart.light.trace7 = #1898d8
Console.LogChart.light.trace8 = #0c6a5d
Console.LogChart.light.trace9 = #6d28d9
Console.LogChart.light.trace10 = #15803d
Console.LogChart.light.trace11 = #5b6b80
Console.LogChart.light.trace12 = #8b5a2b
Console.LogChart.dark.background = #151b26
Console.LogChart.dark.grid = #374352
Console.LogChart.dark.label = #c6d1de
Console.LogChart.dark.hint = #788698
Console.LogChart.dark.cursor = #dce6f59b
Console.LogChart.dark.selection = #5bcdfa30
Console.LogChart.dark.accent = #5bcdfa
Console.LogChart.dark.trace1 = #ffbf47
Console.LogChart.dark.trace2 = #5bcdfa
Console.LogChart.dark.trace3 = #77e2ab
Console.LogChart.dark.trace4 = #f6839d
Console.LogChart.dark.trace5 = #b09bfb
Console.LogChart.dark.trace6 = #ff8f58
Console.LogChart.dark.trace7 = #76deda
Console.LogChart.dark.trace8 = #1f9374
Console.LogChart.dark.trace9 = #f0abfc
Console.LogChart.dark.trace10 = #bef264
Console.LogChart.dark.trace11 = #aab4c3
Console.LogChart.dark.trace12 = #d2a679

#---- Engine Sniffer plot (SnifferPalette): light and dark plots exist in every theme ----
# background and row dividers reuse Console.LogChart.*; channel outlines follow the Pinout type colours

Console.EngineSniffer.light.text = #1f2937
Console.EngineSniffer.light.mutedText = #6b7485
Console.EngineSniffer.light.durationText = #b91c1c
Console.EngineSniffer.light.engineCycle = #16a34a
Console.EngineSniffer.light.timeScale = #c3cad4
Console.EngineSniffer.light.trigger = #7c3aed
Console.EngineSniffer.light.tach = #d97706
Console.EngineSniffer.light.trailingCoil = #ea580c
Console.EngineSniffer.light.coil = #db2777
Console.EngineSniffer.light.injector = #2563eb
Console.EngineSniffer.light.map = #0d9488
Console.EngineSniffer.light.other = #5b6b80
Console.EngineSniffer.dark.text = #e6edf5
Console.EngineSniffer.dark.mutedText = #aab4c3
Console.EngineSniffer.dark.durationText = #f6839d
Console.EngineSniffer.dark.engineCycle = #77e2ab
Console.EngineSniffer.dark.timeScale = #4b5768
Console.EngineSniffer.dark.trigger = #b09bfb
Console.EngineSniffer.dark.tach = #ffbf47
Console.EngineSniffer.dark.trailingCoil = #ff8f58
Console.EngineSniffer.dark.coil = #f0abfc
Console.EngineSniffer.dark.injector = #5bcdfa
Console.EngineSniffer.dark.map = #76deda
Console.EngineSniffer.dark.other = #aab4c3

#---- log viewer histogram (HistogramTable): mixture cells go from neutral at stoichiometric to rich or lean ----
# value and occupancy cells without a mixture use the neutral-to-lean scale

Console.LogViewer.histogram.neutral = @background
Console.LogViewer.histogram.rich = #b4471a
Console.LogViewer.histogram.lean = #2f5bd3
Console.LogViewer.histogram.empty = @rusefiSurface
Console.LogViewer.histogram.emptyBorder = #2a3039
Console.LogViewer.histogram.hatch = #9aa4b22e
Console.LogViewer.histogram.selection = @foreground
Console.LogViewer.histogram.darkText = #151a21
Console.LogViewer.histogram.lightText = #ffffff
Console.LogViewer.histogram.accent = @rusefiAccentForeground

#---- view toggle in a toolbar, e.g. Log Viewer Stats: putClientProperty(STYLE_CLASS, "viewToggle") ----
# a light accent tint when on; plain toolbar buttons turn a heavy grey

[style]ToggleButton.viewToggle = \
    toolbar.selectedBackground: shade(@accentBaseColor,55%); \
    toolbar.selectedForeground: @rusefiAccentForeground

#---- main action button, e.g. Launch Wizard: putClientProperty(STYLE_CLASS, "primary") ----
# every state keeps the blue background and white text; a clicked button keeps focus

[style]Button.primary = \
    background: @accentBaseColor; \
    foreground: #ffffff; \
    hoverBackground: darken(@accentBaseColor,6%); \
    pressedBackground: darken(@accentBaseColor,12%); \
    focusedBackground: @accentBaseColor; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: @accentBaseColor; \
    hoverBorderColor: darken(@accentBaseColor,6%); \
    focusedBorderColor: @rusefiAccentForeground; \
    default.background: @accentBaseColor; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(@accentBaseColor,6%); \
    default.pressedBackground: darken(@accentBaseColor,12%); \
    default.focusedBackground: @accentBaseColor; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: @accentBaseColor; \
    default.hoverBorderColor: darken(@accentBaseColor,6%); \
    default.focusedBorderColor: @rusefiAccentForeground; \
    font: bold

#---- setup wizard one-click choices: a click saves the choice and moves on (cylinder count, firing order) ----
# wizardChoiceMuted marks choices the wizard cannot save (cylinder counts 7, 9 and 16)

[style]Button.wizardChoice = \
    foreground: @rusefiAccentForeground; \
    borderColor: @accentBaseColor; \
    hoverBorderColor: @accentBaseColor; \
    hoverBackground: shade(@accentBaseColor,70%); \
    pressedBackground: shade(@accentBaseColor,55%)

[style]Button.wizardChoiceMuted = \
    foreground: @rusefiMutedForeground; \
    background: @rusefiSectionBackground; \
    borderColor: @rusefiControlTrack

#---- firmware dialogs (DFU, rollback, flash wipe): green confirmation, red cancel or destructive action ----
# The setup wizard uses the blue primary Continue instead. Disabled buttons keep the neutral look.

[style]Button.wizardConfirm = \
    background: #15803d; \
    foreground: #ffffff; \
    hoverBackground: darken(#15803d,6%); \
    pressedBackground: darken(#15803d,12%); \
    focusedBackground: #15803d; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: #15803d; \
    hoverBorderColor: darken(#15803d,6%); \
    focusedBorderColor: darken(#15803d,12%); \
    default.background: #15803d; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(#15803d,6%); \
    default.pressedBackground: darken(#15803d,12%); \
    default.focusedBackground: #15803d; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: #15803d; \
    default.hoverBorderColor: darken(#15803d,6%); \
    default.focusedBorderColor: darken(#15803d,12%)

[style]Button.wizardNegative = \
    background: #b91c1c; \
    foreground: #ffffff; \
    hoverBackground: darken(#b91c1c,6%); \
    pressedBackground: darken(#b91c1c,12%); \
    focusedBackground: #b91c1c; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: #b91c1c; \
    hoverBorderColor: darken(#b91c1c,6%); \
    focusedBorderColor: darken(#b91c1c,12%); \
    default.background: #b91c1c; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(#b91c1c,6%); \
    default.pressedBackground: darken(#b91c1c,12%); \
    default.focusedBackground: #b91c1c; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: #b91c1c; \
    default.hoverBorderColor: darken(#b91c1c,6%); \
    default.focusedBorderColor: darken(#b91c1c,12%)

#---- Tuning menu tree: putClientProperty(STYLE_CLASS, "tuningMenu") ----

[style]Tree.tuningMenu = \
    background: @menuBackground; \
    selectionBackground: shade(@accentBaseColor,55%); \
    selectionForeground: @rusefiAccentForeground; \
    selectionInactiveBackground: @rusefiChipBackground; \
    selectionInactiveForeground: @foreground; \
    selectionArc: 8; \
    selectionInsets: 0,6,0,6

