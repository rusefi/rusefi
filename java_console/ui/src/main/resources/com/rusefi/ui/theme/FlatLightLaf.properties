#---- log viewer histogram (HistogramTable): mixture cells go from neutral at stoichiometric to rich or lean ----
# value and occupancy cells without a mixture use the neutral-to-lean scale

Console.LogViewer.histogram.neutral = @background
Console.LogViewer.histogram.rich = #9a3412
Console.LogViewer.histogram.lean = #1e3a8a
Console.LogViewer.histogram.empty = #ffffff
Console.LogViewer.histogram.emptyBorder = #eef0f3
Console.LogViewer.histogram.hatch = #5862733a
Console.LogViewer.histogram.selection = @foreground
Console.LogViewer.histogram.darkText = @foreground
Console.LogViewer.histogram.lightText = #ffffff
Console.LogViewer.histogram.accent = @rusefiAccentForeground

#---- view toggle in a toolbar, e.g. Log Viewer Stats: putClientProperty(STYLE_CLASS, "viewToggle") ----
# a light accent tint when on; plain toolbar buttons turn a heavy grey

[style]ToggleButton.viewToggle = \
    toolbar.selectedBackground: tint(@accentBaseColor,85%); \
    toolbar.selectedForeground: @rusefiAccentForeground

#---- main action button, e.g. Launch Wizard: putClientProperty(STYLE_CLASS, "primary") ----
# every state keeps the blue background and white text; a clicked button keeps focus

[style]Button.primary = \
    background: @accentBaseColor; \
    foreground: #ffffff; \
    hoverBackground: darken(@accentBaseColor,6%); \
    pressedBackground: darken(@accentBaseColor,12%); \
    focusedBackground: @accentBaseColor; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: @accentBaseColor; \
    hoverBorderColor: darken(@accentBaseColor,6%); \
    focusedBorderColor: @rusefiAccentForeground; \
    default.background: @accentBaseColor; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(@accentBaseColor,6%); \
    default.pressedBackground: darken(@accentBaseColor,12%); \
    default.focusedBackground: @accentBaseColor; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: @accentBaseColor; \
    default.hoverBorderColor: darken(@accentBaseColor,6%); \
    default.focusedBorderColor: @rusefiAccentForeground; \
    font: bold

#---- setup wizard one-click choices: a click saves the choice and moves on (cylinder count, firing order) ----
# wizardChoiceMuted marks choices the wizard cannot save (cylinder counts 7, 9 and 16)

[style]Button.wizardChoice = \
    foreground: @rusefiAccentForeground; \
    borderColor: @accentBaseColor; \
    hoverBorderColor: @accentBaseColor; \
    hoverBackground: tint(@accentBaseColor,90%); \
    pressedBackground: tint(@accentBaseColor,80%)

[style]Button.wizardChoiceMuted = \
    foreground: @rusefiMutedForeground; \
    background: #f7f8fa; \
    borderColor: #e4e7ec

#---- firmware dialogs (DFU, rollback, flash wipe): green confirmation, red cancel or destructive action ----
# The setup wizard uses the blue primary Continue instead. Disabled buttons keep the neutral look.

[style]Button.wizardConfirm = \
    background: #15803d; \
    foreground: #ffffff; \
    hoverBackground: darken(#15803d,6%); \
    pressedBackground: darken(#15803d,12%); \
    focusedBackground: #15803d; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: #15803d; \
    hoverBorderColor: darken(#15803d,6%); \
    focusedBorderColor: darken(#15803d,12%); \
    default.background: #15803d; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(#15803d,6%); \
    default.pressedBackground: darken(#15803d,12%); \
    default.focusedBackground: #15803d; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: #15803d; \
    default.hoverBorderColor: darken(#15803d,6%); \
    default.focusedBorderColor: darken(#15803d,12%)

[style]Button.wizardNegative = \
    background: #b91c1c; \
    foreground: #ffffff; \
    hoverBackground: darken(#b91c1c,6%); \
    pressedBackground: darken(#b91c1c,12%); \
    focusedBackground: #b91c1c; \
    hoverForeground: #ffffff; \
    pressedForeground: #ffffff; \
    focusedForeground: #ffffff; \
    borderColor: #b91c1c; \
    hoverBorderColor: darken(#b91c1c,6%); \
    focusedBorderColor: darken(#b91c1c,12%); \
    default.background: #b91c1c; \
    default.foreground: #ffffff; \
    default.hoverBackground: darken(#b91c1c,6%); \
    default.pressedBackground: darken(#b91c1c,12%); \
    default.focusedBackground: #b91c1c; \
    default.hoverForeground: #ffffff; \
    default.pressedForeground: #ffffff; \
    default.focusedForeground: #ffffff; \
    default.borderColor: #b91c1c; \
    default.hoverBorderColor: darken(#b91c1c,6%); \
    default.focusedBorderColor: darken(#b91c1c,12%)

#---- Tuning menu tree: putClientProperty(STYLE_CLASS, "tuningMenu") ----

[style]Tree.tuningMenu = \
    background: @menuBackground; \
    selectionBackground: tint(@accentBaseColor,85%); \
    selectionForeground: @rusefiAccentForeground; \
    selectionInactiveBackground: @rusefiChipBackground; \
    selectionInactiveForeground: @foreground; \
    selectionArc: 8; \
    selectionInsets: 0,6,0,6

