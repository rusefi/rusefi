# rusEFI console theme: light colours. [tag:console_theme]
# FlatDarkLaf.properties in this package defines the same palette variables with dark
# values and repeats every key below; ThemeParityTest keeps the two key sets equal.
# Keys that only one theme can share (accent tints, solid chips, pin type colours)
# have their own value in each file. LightThemeSnapshotTest pins the light result.

#---- palette ----

@background = #f4f5f7
@foreground = #151a21
@menuBackground = #ffffff
@accentBaseColor = #2563eb

@rusefiSeparator = #dfe3e9
@rusefiMutedForeground = #586273
@rusefiAccentForeground = #1d4ed8
@rusefiChipBackground = #eef0f3
# cards, popups and the selected segment of a switch
@rusefiSurface = #ffffff
# tinted block inside a card
@rusefiSectionBackground = #f7f8fa
# track and border of segmented switches
@rusefiControlTrack = #e4e7ec
@rusefiControlBorder = #d5dae1

# states: text, dot or solid mark, soft background
@rusefiGood = #15803d
@rusefiGoodDot = #16a34a
@rusefiGoodBackground = #e7f6ec
@rusefiWarn = #b45309
@rusefiWarnDot = #d97706
@rusefiWarnBackground = #fdf3e3
@rusefiBad = #b91c1c
@rusefiBadDot = #dc2626
@rusefiBadBackground = #fdecec
@rusefiInfoBackground = #eef4ff

#---- window frame and menu bar ----

TitlePane.borderColor = @rusefiSeparator
MenuBar.borderColor = @rusefiSeparator
Separator.foreground = @rusefiSeparator

# console title text (TitleBarPanel, KeyBadgeIcon)
Console.TitleBar.mutedForeground = @rusefiMutedForeground
Console.TitleBar.chipBackground = @rusefiChipBackground

#---- frame overlays, banners and links (MainFrame, StartupFrame, URLLabel) ----

# full-window messages: firmware check, connection failure, unsaved tune
Console.Overlay.foreground = #404040
Console.Overlay.good = #008000
Console.Overlay.bad = #b20000
# "running from an extracted bundle" strip at the top of the window
Console.InstallerBanner.background = #fff3cd
Console.InstallerBanner.borderColor = #b48c32
Console.Link.foreground = #000099
# short error lines, e.g. "firmware file not found"
Console.ErrorText.foreground = #ff0000
Console.HorizontalLine.foreground = #000000
Console.Announcement.borderColor = #404040

#---- tabs ----

TabbedPane.foreground = @rusefiMutedForeground
TabbedPane.hoverForeground = @foreground
TabbedPane.selectedForeground = @rusefiAccentForeground
TabbedPane.underlineColor = @accentBaseColor
TabbedPane.contentAreaColor = @rusefiSeparator
# the main tab row (TabbedPanel)
Console.TabArea.background = @menuBackground
# bottom status strip of the Gauges, Messages and Engine Sniffer tabs (WarningPanel)
Console.StatusBar.background = @menuBackground
# Gauges toolbar (RPM, command box, Edit dashboard)
Console.Toolbar.background = @menuBackground

#---- connection badge (ConnectionStatusIcon) ----

Console.Status.connected.dot = @rusefiGoodDot
Console.Status.connected.background = @rusefiGoodBackground
Console.Status.connected.foreground = @rusefiGood
Console.Status.disconnected.dot = @rusefiBadDot
Console.Status.disconnected.background = @rusefiBadBackground
Console.Status.disconnected.foreground = @rusefiBad
Console.Status.pending.dot = @rusefiWarnDot
Console.Status.pending.background = @rusefiWarnBackground
Console.Status.pending.foreground = @rusefiWarn
Console.Status.bootloader.dot = #9628d2
Console.Status.bootloader.background = #f3e8fb
Console.Status.bootloader.foreground = #7e22ce

# status chips without a connection state (StatusChip): idle, and what the user inspects
Console.Status.neutral.dot = #9aa3af
Console.Status.neutral.background = #eef0f3
Console.Status.neutral.foreground = #586273
Console.Status.accent.dot = #2563eb
Console.Status.accent.background = #dbeafe
Console.Status.accent.foreground = #1d4ed8

#---- Gauges toolbar: RPM readout (RpmLabel), Grid/Free switch (SegmentedControl) ----

Console.Readout.background = @rusefiChipBackground
Console.Segmented.background = @rusefiControlTrack
Console.Segmented.selectedBackground = @rusefiSurface
Console.Segmented.selectedBorder = @rusefiControlBorder
# grid size picker in the Edit dashboard menu (SizeSelectorPanel)
Console.GridPicker.background = @rusefiSurface
Console.GridPicker.selectedBackground = #dbe7fd
Console.GridPicker.selectedBorder = @accentBaseColor

#---- gauges (GaugeStyle): cards, round dials, bars, live graphs, free layout, detached windows ----

Console.Gauge.card.top = #ffffff
Console.Gauge.card.bottom = #f6f7f9
Console.Gauge.card.border = #e1e4e8
Console.Gauge.text = #111111
Console.Gauge.label = #2b2f33
Console.Gauge.scale = #5f656d
Console.Gauge.tick = #9aa0a6
Console.Gauge.track = #e3e5e8
Console.Gauge.progress = #fce38a
Console.Gauge.dialFill = #fce38a
Console.Gauge.progressStrong = #f6c445
Console.Gauge.warning = #ffa000
Console.Gauge.warningFill = #ffcc80
Console.Gauge.warningText = #e65100
Console.Gauge.danger = #e53935
Console.Gauge.dangerFill = #ffcdd2
Console.Gauge.needle = #e53935
Console.Gauge.bezel.top = #fbfbfc
Console.Gauge.bezel.bottom = #dadde1
Console.Gauge.face.center = #ffffff
Console.Gauge.face.edge = #f3f4f6
Console.Gauge.hub = #ffffff
Console.Gauge.hub.rim = #e1e4e8
Console.Gauge.graph.line = #e0a100
Console.Gauge.graph.grid = #edeff2
Console.Gauge.graph.dangerBand = #ffcdd26e
Console.Gauge.graph.areaTop = #f6c44578
Console.Gauge.graph.areaBottom = #f6c44500
Console.Gauge.edit.accent = #1e88e5
Console.Gauge.edit.outline = #1e88e58c
Console.Gauge.edit.close = #e53935
Console.Gauge.edit.grid = #00000012
Console.Gauge.detached.background = #f3f4f6
Console.Gauge.detached.close = #ff0000
Console.Gauge.hover = #00000018

#---- startup Connect card (com.rusefi.ui.startup) ----

Console.Card.background = @rusefiSurface
Console.Card.borderColor = @rusefiSeparator
Console.Card.sectionBackground = @rusefiSectionBackground
Console.Illustration.line = #7b8494
Console.Illustration.fill = #f1f3f6
Console.Banner.info.background = @rusefiInfoBackground
Console.Banner.info.borderColor = #c9dafb
Console.Banner.info.accent = @rusefiAccentForeground
Console.Banner.warning.background = #fff8e6
Console.Banner.warning.borderColor = #f3dca7
Console.Banner.warning.accent = #b7791f
Console.Banner.error.background = @rusefiBadBackground
Console.Banner.error.borderColor = #f5c2c2
Console.Banner.error.accent = @rusefiBad

#---- setup wizard (com.rusefi.ui.wizard.WizardStyle) ----
# step cards reuse Console.Card.*, the header and footer strips Console.TabArea.background

Console.Wizard.mutedForeground = @rusefiMutedForeground
Console.Wizard.accentForeground = @rusefiAccentForeground
Console.Wizard.success.foreground = @rusefiGood
Console.Wizard.success.background = @rusefiGoodBackground
Console.Wizard.error.foreground = @rusefiBad
Console.Wizard.error.background = @rusefiBadBackground

#---- Tuning tab (com.rusefi.ui.widgets.tune.TuningStyle) ----
# the toolbar, indicator row and live value strip reuse Console.Toolbar.background,
# the dialog card reuses Console.Card.*

Console.Tuning.sidebar.background = @menuBackground
Console.Tuning.mutedForeground = @rusefiMutedForeground
Console.Tuning.dirtyForeground = @rusefiWarn
# live value strip (TextGauge): a mild accent tint sets live data apart from settings
Console.Tuning.liveValue.background = tint(@accentBaseColor,94%)
Console.Tuning.liveValue.borderColor = tint(@accentBaseColor,80%)
Console.Tuning.section.borderColor = @rusefiSeparator
Console.Tuning.section.hoverBorderColor = tint(@accentBaseColor,55%)
Console.Tuning.section.title = @foreground
# indicators (INI [FrontPage] and dialog indicators): the INI colour names pick a chip colour.
# Red, yellow and green are solid, bold chips that stand out; the other tones stay soft.
Console.Tuning.indicator.neutral.background = @rusefiChipBackground
Console.Tuning.indicator.neutral.foreground = @rusefiMutedForeground
Console.Tuning.indicator.red.background = #dc2626
Console.Tuning.indicator.red.foreground = #ffffff
Console.Tuning.indicator.yellow.background = #f59e0b
Console.Tuning.indicator.yellow.foreground = #1f1300
Console.Tuning.indicator.green.background = #16a34a
Console.Tuning.indicator.green.foreground = #ffffff
Console.Tuning.indicator.blue.background = @rusefiInfoBackground
Console.Tuning.indicator.blue.foreground = @rusefiAccentForeground
Console.Tuning.indicator.dark.background = #334155
Console.Tuning.indicator.dark.foreground = #ffffff

#---- log viewer window (LogViewerPanel, ChartToolbar, LogStatusBar) ----
# its toolbar and status strip reuse Console.Toolbar.background and Console.StatusBar.background

Console.LogViewer.sidebar.background = @menuBackground
Console.LogViewer.mutedForeground = @rusefiMutedForeground
Console.LogViewer.chipBackground = @rusefiChipBackground
Console.LogViewer.sectionDivider = @rusefiSeparator

