# rusEFI console theme: settings shared by every FlatLaf theme (light and dark).
# [tag:console_theme] FlatLaf loads this file and then the file named after the
# active theme class (FlatLightLaf.properties, later FlatDarkLaf.properties) from
# this package, registered by UiHelper.configureLaf(). Put sizes and shapes here
# and colours in the per-theme files: FlatLaf's own FlatLightLaf.properties
# assigns most colour keys and would override colours set in this file.

TitlePane.buttonSize = 45,30
TitlePane.iconSize = 18,18

Button.arc = 10
Component.arc = 10
ProgressBar.arc = 10
TextComponent.arc = 10

# Underlined top-level tabs: a taller row with a thin accent underline
TabbedPane.tabHeight = 40
TabbedPane.tabSelectionHeight = 2
