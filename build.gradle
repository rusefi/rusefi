plugins {
  id 'com.gradleup.shadow' version "${shadowVersion}"  apply false
}

apply from: 'dependencies.gradle'

allprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
          // [tag:java25] the project now ships Java 25 bytecode (class major 69):
          // the console and the tools require a modern JRE. NOTE: the TunerStudio
          // plugin modules can no longer run inside TunerStudio's bundled Java 8
          // runtime - TS would need a newer JVM.
          sourceCompatibility = '25'
          targetCompatibility = '25'
          toolchain {
            languageVersion.set(JavaLanguageVersion.of(25))
          }
        }

        dependencies {
            implementation global_libs.annotations
            testImplementation global_libs.junit5
            testImplementation global_libs.junit5engine
            // Gradle 9 removed the implicit JUnit Platform launcher wiring
            testRuntimeOnly global_libs.junit5launcher
        }

      test {
        // Enable JUnit 5
        useJUnitPlatform()
      }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }

    tasks.withType(JavaExec).configureEach {
        if (name.endsWith("main()")) {
            // https://github.com/gradle/gradle/issues/21364
            notCompatibleWithConfigurationCache("JavaExec created by IntelliJ")
        }
    }
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}

// gradlew allDeps
subprojects {
    task allDeps(type: DependencyReportTask) {}

  apply plugin: 'java-library'
  apply plugin: 'java-test-fixtures'
  apply plugin: 'com.gradleup.shadow'
}
