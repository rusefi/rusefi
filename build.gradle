plugins {
  id 'com.gradleup.shadow' version "${shadowVersion}"  apply false
}

apply from: 'dependencies.gradle'

allprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
          // TS still comes with 1.8 and we have a plugin, lets build compatible
          sourceCompatibility = '8'
          targetCompatibility = '8'
          // [tag:java8] bytecode stays at Java 8 for the TS plugin runtime, but the
          // COMPILER (and the gradle daemon / test JVM) run on the current JDK (25).
          toolchain {
            languageVersion.set(JavaLanguageVersion.of(25))
          }
        }

        dependencies {
            implementation global_libs.annotations
            testImplementation global_libs.junit5
            testImplementation global_libs.junit5engine
            // Gradle 9 removed the implicit JUnit Platform launcher wiring
            testRuntimeOnly global_libs.junit5launcher
        }

      test {
        // Enable JUnit 5
        useJUnitPlatform()
      }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            // [tag:java8] source/target 8 is obsolete on modern javac; it is kept
            // intentionally for the TS plugin - silence the per-build warning
            options.compilerArgs << "-Xlint:-options"
        }
    }

    tasks.withType(JavaExec).configureEach {
        if (name.endsWith("main()")) {
            // https://github.com/gradle/gradle/issues/21364
            notCompatibleWithConfigurationCache("JavaExec created by IntelliJ")
        }
    }
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}

// gradlew allDeps
subprojects {
    task allDeps(type: DependencyReportTask) {}

  apply plugin: 'java-library'
  apply plugin: 'java-test-fixtures'
  apply plugin: 'com.gradleup.shadow'
}
