plugins {
  id 'idea'
  id 'com.gradleup.shadow' version "${shadowVersion}"  apply false
}

apply from: 'dependencies.gradle'

// Only the Gradle/IntelliJ module excludes these; CLion's CMake project still indexes them.
// Keep firmware config, integration and TunerStudio inputs available to Java tooling.
idea.module {
    excludeDirs += files(
        '.pixi',
        'firmware/ChibiOS', 'firmware/ChibiOS-Contrib',
        'firmware/bootloader', 'firmware/console', 'firmware/controllers',
        'firmware/development', 'firmware/ext', 'firmware/ext_algo',
        'firmware/hw_layer', 'firmware/init', 'firmware/libfirmware',
        'firmware/live_data_generated', 'firmware/pch', 'firmware/tools', 'firmware/util',
        'simulator', 'unit_tests'
    )
}

allprojects {
    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin) {
        java {
          // TS still comes with 1.8 and we have a plugin, lets build compatible
          sourceCompatibility = '8'
          targetCompatibility = '8'
          // [tag:java8]
          toolchain {
            languageVersion.set(JavaLanguageVersion.of(11))
          }
        }

        dependencies {
            implementation global_libs.annotations
            testImplementation global_libs.junit5
            testImplementation global_libs.junit5engine
        }

      test {
        // Enable JUnit 5
        useJUnitPlatform()
      }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            // [tag:java_source_encoding] Sources are UTF-8. Without this, javac uses the platform
            // charset (windows-1252 on Windows), so a literal like an ellipsis compiles into three
            // garbled characters in Windows builds only. Covered by SourceEncodingTest.
            options.encoding = 'UTF-8'
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }

    tasks.withType(JavaExec).configureEach {
        if (name.endsWith("main()")) {
            // https://github.com/gradle/gradle/issues/21364
            notCompatibleWithConfigurationCache("JavaExec created by IntelliJ")
        }
    }
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}

// gradlew allDeps
subprojects {
    task allDeps(type: DependencyReportTask) {}

  apply plugin: 'java-library'
  apply plugin: 'java-test-fixtures'
  apply plugin: 'com.gradleup.shadow'
}
