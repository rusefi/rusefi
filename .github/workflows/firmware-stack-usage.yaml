#
# Firmware stack usage report - see java_tools/gcc_map_reader/README.md
#
# Inputs, per matrix board:
#   - firmware + bootloader ELF/map built with -fstack-usage -fcallgraph-info=su:
#     per-function frame sizes (.su) and the post-LTO callgraph (.ci)
#   - RUSEFI_STACK_ROOT* metadata (controllers/core/common_headers.h): which
#     thread entry owns which working area and its byte budget; linked into
#     non-allocated ELF sections, not flashed
#   - board meta-info.env: STACK_USAGE_PROFILE (optional STACK_USAGE_PROFILE_FILE)
#   - hand-maintained profile table
#     java_tools/gcc_map_reader/src/main/resources/stack_usage/<profile>.md:
#     display names, hardware-measured "Reviewed" bytes, proxy snapshot, scenario
#
# Outputs:
#   - firmware/build/firmware_stack_usage_<profile>.md per job
#   - pull requests: appended to the job step summary
#   - master (schedule / manual): uploaded as artifact, then update-reference
#     assembles docs/firmware_stack_usage.md and commits it to master
#
# What fails and what does not:
#   - FAILS: a linked stack root missing from / extra in the profile table,
#     a reviewed measurement larger than its budget (--check-reviewed),
#     a single function frame over 1 KB (-Wstack-usage=1024 under -Werror)
#   - DOES NOT FAIL: a small budget, "Current proxy" above nominal, or proxy
#     growth since the snapshot ("REVIEW PROXY +N"). Those are report-only;
#     a human reads the summary. The proxy is a direct-call estimate that
#     ignores indirect calls, unknown frames, recursion, interrupts and
#     context switching, so it is not a proof either way.
#
# Known blind spots
#   - Virtual and function-pointer calls appear in the callgraph only as
#     "__indirect_call"; the callee subtree contributes 0 bytes. Every
#     EngineModule / Sensor / storage-backend dispatch is such a call, e.g.
#     storageWrite() -> SettingStorageBase::store(): the storage manager proxy
#     contains none of FatFS. Roots with many indirect edges are the least
#     trustworthy rows, not the safest.
#   - exception/ISR (main stack, hosts the fast/slow periodic callbacks and
#     nested interrupts) has no entry function and is never analyzed.
#   - Functions without .su data (newlib, builtins, foreign objects) count as
#     0 bytes; recursive components are summed once; alloca/VLA frames are
#     flagged "dynamic" but not sized.
#   - Only threads tagged RUSEFI_STACK_ROOT* are seen. Any untagged
#     ThreadController / THD_WORKING_AREA is invisible (at the time of writing:
#     DtcManager, waSentDecoderThread). Profile membership is exact, so a new
#     tagged thread fails the job until its profile row exists - tag threads
#     when you add them.
#   - Nominal is the working-area N. The physical area is N + thread_t (188)
#     + FPU context (204) + PORT_INT_REQUIRED_STACK (128); an overflow leaves
#     the area at the bottom into the neighbouring .bss object, and the
#     ChibiOS check only fires at a context switch of the overflowing thread.
#   - "Reviewed" values are hand-typed hardware measurements of ONE scenario
#     on ONE board (currently f407-discovery only); nothing re-measures them.
#     The runtime counterpart (`threadsinfo` after each HW CI test) runs on
#     boards without an SD card, so SD/FatFS paths are never measured by CI.
#
name: Firmware Stack Usage

on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  stack-usage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - meta-info: config/boards/f407-discovery/meta-info.env
          - meta-info: config/boards/nucleo_f767/meta-info.env
          - meta-info: config/boards/nucleo_h743/meta-info.env
          - meta-info: config/boards/hellen/uaefi/meta-info.env
          - meta-info: config/boards/hellen/uaefi/meta-info-uaefi_pro.env

    steps:
    - uses: actions/checkout@v7

    - name: Resolve stack usage profile
      id: stack_profile
      working-directory: ./firmware/
      run: |
        source config/boards/common_script_read_meta_env.inc "${{ matrix.meta-info }}"
        echo "profile=${STACK_USAGE_PROFILE:-$SHORT_BOARD_NAME}" >> "$GITHUB_OUTPUT"
        echo "profile-file=${STACK_USAGE_PROFILE_FILE:-}" >> "$GITHUB_OUTPUT"

    - name: Checkout Submodules
      run: misc/git_scripts/common_submodule_init.sh

    - uses: ./.github/actions/setup-java

    - name: Install build tools
      run: |
        sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh
        sudo bash misc/actions/ubuntu-install-tools.sh

    - name: Acquire Arm GNU Toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1.13.0
      with:
        release: '14.2.Rel1'

    - name: Build firmware and bootloader callgraphs
      working-directory: ./firmware/
      env:
        EXTRA_3_PARAMS: -fstack-usage -fcallgraph-info=su -Wstack-usage=1024
      run: bash bin/compile.sh "${{ matrix.meta-info }}" elf bootloader --output-sync=recurse

    - name: Test and generate stack usage report
      working-directory: ./firmware/
      env:
        STACK_USAGE_PROFILE_FILE: ${{ steps.stack_profile.outputs.profile-file }}
      run: |
        ../gradlew -p .. :gcc_map_reader:test :gcc_map_reader:shadowJar
        profile_file=()
        if [ -n "$STACK_USAGE_PROFILE_FILE" ]; then
          profile_file=(--profile-file "$STACK_USAGE_PROFILE_FILE")
        fi
        java -cp ../java_tools/gcc_map_reader/build/libs/gcc_map_reader-all.jar \
           com.rusefi.tools.stack.StackUsageReport \
           --profile "${{ steps.stack_profile.outputs.profile }}" \
           "${profile_file[@]}" \
           --check-reviewed \
           --output "build/firmware_stack_usage_${{ steps.stack_profile.outputs.profile }}.md"

    - name: Publish pull request workflow summary
      if: ${{ github.event_name == 'pull_request' }}
      working-directory: ./firmware/
      run: cat "build/firmware_stack_usage_${{ steps.stack_profile.outputs.profile }}.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload scheduled report
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      uses: actions/upload-artifact@v7
      with:
        name: firmware_stack_usage_${{ steps.stack_profile.outputs.profile }}
        path: ./firmware/build/firmware_stack_usage_${{ steps.stack_profile.outputs.profile }}.md

  update-reference:
    needs: stack-usage
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: firmware-stack-usage-${{ github.ref }}
      queue: max
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Download stack usage reports
      uses: actions/download-artifact@v8
      with:
        pattern: firmware_stack_usage_*
        path: stack-usage
        merge-multiple: true

    - name: Assemble firmware stack usage document
      run: |
        {
          echo '<!-- Generated by .github/workflows/firmware-stack-usage.yaml from StackUsageReport output. Do not edit. See java_tools/gcc_map_reader/README.md. -->'
          echo
          for report in stack-usage/firmware_stack_usage_*.md; do
            cat "$report"
            echo
          done
        } > docs/firmware_stack_usage.md

    - name: Commit firmware stack usage document
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub firmware stack usage Action"
        .github/workflows/bin/smart-git-add.sh docs/firmware_stack_usage.md
        OUT=$(git commit -m "Auto-generated firmware stack usage" docs/firmware_stack_usage.md 2>&1) || echo "commit failed, finding out why"
        echo "$OUT"
        if echo "$OUT" | grep 'nothing to commit\|no changes added'; then
          echo "firmware stack usage: looks like nothing to commit"
        elif echo "$OUT" | grep 'changed'; then
          if [ "${{ github.repository }}" = "rusefi/rusefi" ]; then
            echo "COMMIT=true" >> "$GITHUB_ENV"
            echo "firmware stack usage: changed on master, pushing"
          else
            echo "firmware stack usage: changed, but this is a fork"
          fi
        else
          echo "firmware stack usage: unexpected commit result"
          exit 1
        fi

    - name: Push current firmware stack usage document
      if: ${{ env.COMMIT == 'true' }}
      run: |
        can_publish() {
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            return 1
          fi
          while IFS=$'\t' read -r AUTHOR SUBJECT; do
            if [ "$AUTHOR" != "action@github.com" ]; then
              return 1
            fi
            case "$SUBJECT" in
              "Auto-generated configs and docs"|"Trigger wheel definitions"|"Auto-generated default tune"|"Update date") ;;
              *) return 1 ;;
            esac
          done < <(git log --format='%ae%x09%s' "${{ github.sha }}..origin/master")
        }

        for ATTEMPT in 1 2 3; do
          git fetch origin master
          if ! can_publish; then
            echo "master advanced with non-generated changes; skipping this stale report"
            exit 0
          fi
          git rebase origin/master
          if git push origin HEAD:master; then
            exit 0
          fi
          echo "push attempt $ATTEMPT raced another generated commit; retrying"
          sleep 2
        done
        echo "failed to push firmware stack usage after 3 attempts"
        exit 1
