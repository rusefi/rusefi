#
#
#

name: Update rusEFI Reference

on:
  workflow_call:

jobs:
  update-git:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: reference-update-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Git Checkout Submodules
        run: |
          git submodule update --init --depth=1 ext/rusefi

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Git Update Submodules
        env:
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$CALLER_REF" in
            refs/heads/*) caller_branch="${CALLER_REF#refs/heads/}" ;;
            *) echo "Expected a branch ref, got '$CALLER_REF'" >&2; exit 1 ;;
          esac
          if [ "$caller_branch" = "main" ]; then
            expected_branch=master
          else
            expected_branch=$caller_branch
          fi
          section=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '$2 == "ext/rusefi" { sub(/\.path$/, "", $1); print $1 }')
          if [ -z "$section" ]; then
            echo "ext/rusefi is not configured in .gitmodules" >&2
            exit 1
          fi
          tracked_branch=$(git config -f .gitmodules --get "$section.branch" || true)
          if [ -z "$tracked_branch" ] && [ "$caller_branch" != "master" ] && [ "$caller_branch" != "main" ]; then
            echo "ext/rusefi must configure its tracking branch as '$expected_branch' for '$caller_branch'" >&2
            exit 1
          fi
          if [ -n "$tracked_branch" ] && [ "$tracked_branch" != "$expected_branch" ]; then
            echo "ext/rusefi tracks '${tracked_branch:-<unset>}', expected '$expected_branch' for '$caller_branch'" >&2
            exit 1
          fi
          # Shallow initialization may only have fetched the default branch.
          git -C ext/rusefi fetch --depth=1 origin "+refs/heads/$expected_branch:refs/remotes/origin/$expected_branch"
          # Preserve updates of other initialized direct dependencies using
          # their own tracking configuration; only rusEFI gets this override.
          git -c "$section.branch=$expected_branch" submodule update --remote

      - name: Commit fresh submodule gitlinks
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub git update Action"
          paths_file=$(mktemp)
          trap 'rm -f "$paths_file"' EXIT
          git submodule foreach --quiet 'printf "%s\\0" "$sm_path"' > "$paths_file"
          mapfile -d '' -t submodule_paths < "$paths_file"
          if [ "${#submodule_paths[@]}" -eq 0 ]; then
            echo "submodule: looks like nothing to commit"
            echo "NOCOMMIT=true" >> $GITHUB_ENV
          else
            pathspecs=()
            for path in "${submodule_paths[@]}"; do
              pathspecs+=(":(literal)$path")
            done
            git add -- "${pathspecs[@]}"
            if git diff --cached --quiet -- "${pathspecs[@]}"; then
              echo "submodule: looks like nothing to commit"
              echo "NOCOMMIT=true" >> $GITHUB_ENV
            else
              git commit -m "GHA says update rusEFI submodules" --only -- "${pathspecs[@]}"
            fi
          fi
          git status

      - name: Push
        if: ${{ env.NOCOMMIT != 'true'}}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: ${{ github.ref }}
