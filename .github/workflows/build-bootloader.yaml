name: Only Bootloader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Checkout Submodules
        # [tag:submodule_auth] see .github/actions/submodule-init/action.yml
        uses: ./.github/actions/submodule-init
        with:
          token: ${{ secrets.MY_REPO_PAT }}

      - uses: ./.github/actions/setup-java

      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1.14.1
        with:
          release: '14.2.Rel1'

      - name: Build Proteus F7 Bootloader
        working-directory: ./firmware
        run: bash bin/compile.sh config/boards/proteus/meta-info-proteus_f7.env bootloader
