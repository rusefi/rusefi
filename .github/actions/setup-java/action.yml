name: 'rusEFI Setup Java'
description: 'Shared Java setup configuration for rusEFI'
inputs:
  java-version:
    description: 'Java version'
    required: false
    default: '17'
  distribution:
    description: 'Java distribution'
    required: false
    default: 'zulu'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper
        cache-overwrite-existing: true
        # One cache owner; trusted push runs can populate their branch cache.
        cache-read-only: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
