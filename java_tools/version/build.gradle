import java.time.LocalDate
import java.time.ZoneId
import java.time.format.DateTimeFormatter

// Auto-generate GeneratedUiVersion.CONSOLE_VERSION from today's date so every build carries
// the build date without a manual UiVersion bump. Europe/London matches gen_signature.sh, so
// the console date and the firmware signature date roll over at the same instant.
//
// The generator only rewrites the file when the date actually rolled over: same-day builds
// stay fully incremental, and the first build after midnight recompiles everything that
// inlines the constant (Gradle treats inlined constants as part of a dependency's ABI).
def generatedVersionDir = layout.buildDirectory.dir('generated-src/version')

def generateUiVersion = tasks.register('generateUiVersion') {
    def versionProvider = providers.provider {
        LocalDate.now(ZoneId.of('Europe/London')).format(DateTimeFormatter.ofPattern('yyyyMMdd'))
    }
    inputs.property('consoleVersionDate', versionProvider)
    def outputFile = generatedVersionDir.map { it.file('com/rusefi/GeneratedUiVersion.java') }
    outputs.file(outputFile)

    doLast {
        def version = versionProvider.get()
        def text = "// Generated by :version:generateUiVersion - do not edit, rebuild to refresh\n" +
            "package com.rusefi;\n\n" +
            "public interface GeneratedUiVersion {\n" +
            "    int CONSOLE_VERSION = ${version};\n" +
            "}\n"
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        // write only when the content changed, otherwise every build would retouch the source
        // and force a full recompile
        if (!file.exists() || file.text != text) {
            file.text = text
        }
    }
}

sourceSets.main.java.srcDir generatedVersionDir

tasks.named('compileJava') {
    dependsOn generateUiVersion
}
